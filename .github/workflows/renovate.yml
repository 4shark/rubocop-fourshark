name: Renovate

on:
  schedule:
    - cron: '0 11 * * 1-5'
  workflow_dispatch:

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      # An unset variable interpolates to the empty string, so the age below
      # would read " days" and Renovate would run with no quarantine at all.
      - name: Require the minimum release age to be configured
        run: ': "${MINIMUM_RELEASE_AGE_DAYS:?DEPENDENCY_MINIMUM_RELEASE_AGE_DAYS is required}"'
        env:
          MINIMUM_RELEASE_AGE_DAYS: ${{ vars.DEPENDENCY_MINIMUM_RELEASE_AGE_DAYS }}

      - uses: renovatebot/github-action@316d7cd859606d6039a2182b7d69199e9b036835 # v46.2.1
        with:
          token: ${{ steps.app-token.outputs.token }}
        env:
          LOG_LEVEL: info
          RENOVATE_GIT_AUTHOR: ${{ vars.RENOVATE_GIT_AUTHOR }}
          RENOVATE_MINIMUM_RELEASE_AGE: '${{ vars.DEPENDENCY_MINIMUM_RELEASE_AGE_DAYS }} days'
          RENOVATE_REPOSITORIES: '["${{ github.repository }}"]'
          RENOVATE_USERNAME: ${{ vars.RENOVATE_USERNAME }}
