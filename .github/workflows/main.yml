name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      matrix:
        ruby:
          - '4.0.6'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run the default task
        run: bundle exec rake

  licenses:
    runs-on: ubuntu-latest
    name: Licenses (License Compliance)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: '4.0.6'
          bundler-cache: true
      - name: Install Syft and Grant
        shell: bash
        run: |
          curl -sSfL https://get.anchore.io/syft | sh -s -- -b "$RUNNER_TEMP/bin" v1.51.1
          curl -sSfL https://get.anchore.io/grant | sh -s -- -b "$RUNNER_TEMP/bin" v0.6.8
          # The Anchore installer exits 0 even when the download fails, so run each binary to prove it was installed.
          "$RUNNER_TEMP/bin/syft" version
          "$RUNNER_TEMP/bin/grant" version
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Generate dependency SBOM
        run: syft scan dir:. --override-default-catalogers ruby-installed-gemspec-cataloger -o syft-json --file sbom.json
      - name: Check dependency licenses
        run: grant check -c .grant.yaml --disable-file-search sbom.json
