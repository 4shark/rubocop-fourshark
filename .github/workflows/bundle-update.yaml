name: Bundle Update

on:
  schedule:
    - cron: '0 11 * * 1'
  workflow_dispatch:

jobs:
  bundle-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Require the minimum release age to be configured
        run: ': "${MINIMUM_RELEASE_AGE_DAYS:?DEPENDENCY_MINIMUM_RELEASE_AGE_DAYS is required}"'
        env:
          MINIMUM_RELEASE_AGE_DAYS: ${{ vars.DEPENDENCY_MINIMUM_RELEASE_AGE_DAYS }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Update the dependencies nothing in the repository declares
        run: bash .github/scripts/update-transitive-dependencies.sh
        env:
          BUNDLE_COOLDOWN: ${{ vars.DEPENDENCY_MINIMUM_RELEASE_AGE_DAYS }}
        timeout-minutes: 10

      - name: Open a pull request when the lockfile changed
        run: bash .github/scripts/open-bundle-update-pull-request.sh
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
