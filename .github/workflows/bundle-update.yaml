name: Bundle Update

on:
  schedule:
    - cron: '0 11 * * 1'
  workflow_dispatch:

jobs:
  bundle-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Require the minimum release age to be configured
        run: ': "${MINIMUM_RELEASE_AGE_DAYS:?DEPENDENCY_MINIMUM_RELEASE_AGE_DAYS is required}"'
        env:
          MINIMUM_RELEASE_AGE_DAYS: ${{ vars.DEPENDENCY_MINIMUM_RELEASE_AGE_DAYS }}

      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: .ruby-version
          bundler: '4.0.19'
          bundler-cache: true

      # BUNDLE_COOLDOWN reaches `bundle lock` only from Bundler 4.0.18; below
      # that it is unrecognised config a lower Bundler ignores in silence, so
      # the job resolves with no minimum release age and nothing says so.
      - name: Require a Bundler that applies the cooldown to bundle lock
        run: ruby -rbundler -e 'abort "Bundler >= 4.0.18 is required for BUNDLE_COOLDOWN to reach bundle lock; got #{Bundler::VERSION}" if Gem::Version.new(Bundler::VERSION) < Gem::Version.new("4.0.18")'

      - name: Update the dependencies nothing in the repository declares
        run: bash .github/scripts/update-transitive-dependencies.sh
        env:
          BUNDLE_COOLDOWN: ${{ vars.DEPENDENCY_MINIMUM_RELEASE_AGE_DAYS }}
        timeout-minutes: 10

      - name: Open a pull request when the lockfile changed
        run: bash .github/scripts/open-bundle-update-pull-request.sh
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
