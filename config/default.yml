# rubocop-fourshark — custom cops (4Shark conventions).
# Cops live in their natural stock departments (Style/Rails/RSpec/Layout/FactoryBot)
# so the names read like any other cop. Where a 4Shark cop supersedes or
# contradicts a stock cop, the stock cop is disabled here (see the bottom block).

Layout/MultilineStatementSpacing:
  Description: 'Add a blank line between consecutive statements when either spans multiple lines.'
  Enabled: true
  VersionAdded: '0.2.0'

# Stock cop configured (not a 4Shark cop): enforce the `indented` style for
# multiline method-call chains — continuation calls are indented one step from
# the receiver instead of aligning with the first call.
Layout/MultilineMethodCallIndentation:
  EnforcedStyle: indented

# Stock cop configured (not a 4Shark cop): name the rescued exception variable
# `exception`. The cop's default is `e`, and a single-letter variable is banned by
# the 4Shark naming convention — so the two disagree wherever a rescue binds its
# exception. `PreferredName` is the option the cop ships to settle exactly that,
# and the cop autocorrects, so the rename is mechanical.
Naming/RescuedExceptionsVariableName:
  PreferredName: exception

Style/DisallowDelegate:
  Description: 'Do not use automatic delegation. Write the method explicitly.'
  Enabled: true
  VersionAdded: '0.7.0'

Style/DisallowSafeNavigation:
  Description: 'Do not use safe navigation (`&.`). Use explicit conditionals instead.'
  Enabled: true
  VersionAdded: '0.1.0'

Style/DisallowTernary:
  Description: 'Do not use the ternary conditional. Use an explicit `if`/`else` instead.'
  Enabled: true
  VersionAdded: '0.7.0'

Style/DisallowTry:
  Description: 'Do not use `try` or `try!`. Use explicit conditionals instead.'
  Enabled: true
  VersionAdded: '0.1.0'

Rails/MandatoryInverseOf:
  Description: 'Every association must declare `inverse_of` (stricter than stock `Rails/InverseOf`).'
  Enabled: true
  Include:
    - 'app/models/**/*.rb'
  Exclude:
    - 'app/serializers/**/*.rb'
  VersionAdded: '0.2.0'

Rails/BidirectionalAssociation:
  Description: 'Associations must be declared on both sides of the relationship.'
  Enabled: true
  Include:
    - 'app/models/**/*.rb'
  Exclude:
    - 'app/serializers/**/*.rb'
  VersionAdded: '0.2.0'

Rails/OptionalBelongsTo:
  Description: 'Declare `belongs_to` with `optional: true` and validate presence manually.'
  Enabled: true
  Include:
    - 'app/models/**/*.rb'
  VersionAdded: '0.1.0'

Rails/OrderedMacros:
  Description: 'Sort same-kind class macro declarations (associations, validations, scopes) alphabetically.'
  Enabled: true
  Include:
    - 'app/models/**/*.rb'
  VersionAdded: '0.2.0'

# Stock cop configured (not a 4Shark cop): map `let!` to `let` so every eager
# `let!` call is flagged in favor of a lazy `let` (force creation in an explicit
# `before`, not with `let!`). `subject`/`subject!` are intentionally NOT remapped:
# RSpec/Dialect renames the identifier blindly, so a `subject` -> `let` mapping
# also rewrites value references like `expect(subject)` into invalid `expect(let)`.
RSpec/Dialect:
  Description: 'Prefer a lazy `let` over `let!` — force creation in an explicit `before`, not with `let!`.'
  Enabled: true
  PreferredMethods:
    let!: let
  Include:
    - 'spec/**/*_spec.rb'

RSpec/InverseOfMatcher:
  Description: 'Root models must include `.inverse_of` in association specs; subclasses must not.'
  Enabled: true
  Include:
    - 'spec/models/**/*_spec.rb'
  VersionAdded: '0.2.0'

RSpec/OverwrittenLet:
  Description: 'Do not override a `let` defined in an outer example group.'
  Enabled: true
  Include:
    - 'spec/**/*_spec.rb'
  VersionAdded: '0.2.0'

RSpec/ConditionalInLet:
  Description: 'Do not put conditional logic in a `let` — use separate contexts.'
  Enabled: true
  Include:
    - 'spec/**/*_spec.rb'
  VersionAdded: '0.2.0'

RSpec/FactoryBotInBefore:
  Description: 'Do not create objects in `before` — use `let` for object creation.'
  Enabled: true
  Include:
    - 'spec/**/*_spec.rb'
  VersionAdded: '0.2.0'

FactoryBot/AssociationInFactory:
  Description: 'Do not declare associations in factories — set them manually in the spec.'
  Enabled: true
  Include:
    - 'spec/factories/**/*.rb'
  VersionAdded: '0.2.0'

# Stock cops disabled because a 4Shark cop supersedes or contradicts them.
# `Rails/Delegate` flags `def bar; foo.bar; end` and asks for `delegate :bar, to: :foo`,
# the opposite of `Style/DisallowDelegate`.
# `Rails/InverseOf` only flags when AR can't auto-detect the inverse;
# `Rails/MandatoryInverseOf` covers it and more.
# The three ternary-shaping cops are superseded by `Style/DisallowTernary`, which bans
# every ternary — they could only ever fire on a line that is already an offense.
# `Style/SafeNavigation` converts to `&.`, the opposite of `Style/DisallowSafeNavigation`.
Rails/Delegate:
  Enabled: false

Rails/InverseOf:
  Enabled: false

Style/MultilineTernaryOperator:
  Enabled: false

Style/NestedTernaryOperator:
  Enabled: false

Style/SafeNavigation:
  Enabled: false

Style/TernaryParentheses:
  Enabled: false
